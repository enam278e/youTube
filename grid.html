<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid Practice</title>
</head>
<body style="margin-bottom: 1000px;">
  <div style="display: grid;
  grid-template-columns: 100px 100px;"
  >
  <div style="background-color: lightblue;">div1</div>
  <div style="background-color: lightcoral;">div2 <p>text</p></div>

</div>
  <div style="display: grid;
  grid-template-columns: 100px 1fr;
  margin-top: 30px;"
  >
  <div style="background-color: lightblue;">div1</div>
  <div style="background-color: lightcoral;">div2 <p>text</p></div>

</div>
  <div style="display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  margin-top: 30px;
  column-gap: 20px;
  row-gap: 40px;"
  >
  <div style="background-color: lightblue; height: 200px;">div1</div>
  <div style="background-color: lightcoral;">1fr</div>
  <div style="background-color: rgb(24, 1, 129);">1fr</div>
  <div style="background-color: rgb(7, 179, 21); height: 200px;">div1</div>
  <div style="background-color: rgb(75, 8, 102);">1fr</div>
  <div style="background-color: rgb(82, 6, 59);">1fr</div>

</div>
</body>
</html>
